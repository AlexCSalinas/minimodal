name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: orchestrator/go.mod

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate Go proto stubs
        run: make proto-go

      - name: gofmt
        working-directory: orchestrator
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::files not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: orchestrator
        run: go vet ./...

      - name: go test (race detector on)
        working-directory: orchestrator
        run: go test -race -v ./...

      - name: go build
        working-directory: orchestrator
        run: go build -o orchestrator .

  python:
    name: python lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r worker/requirements.txt pytest ruff
          python -m pip install -e sdk

      - name: Generate Python proto stubs
        run: make proto-py

      - name: ruff
        run: ruff check .

      - name: pytest
        run: pytest
